name: Bug report
description: Report a reproducible problem in OpenRevOps
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug! Please **do not include secrets or real customer data /
        PII** — redact logs and traces. Security vulnerabilities must **not** be filed here;
        follow [SECURITY.md](../blob/main/SECURITY.md) instead.
  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight
      options:
        - label: I searched existing issues and discussions and this isn't a duplicate.
          required: true
        - label: This is not a security vulnerability (those go through SECURITY.md).
          required: true
        - label: My report contains no secrets and no real customer data / PII.
          required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what actually happened?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Exact commands, scenario id, and inputs (synthetic only).
      placeholder: |
        1. pnpm demo:seed
        2. …
        3. See error
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or decision trace
      description: Paste output with secrets and PII redacted. This will be rendered as code.
      render: shell
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Node (`node -v`), pnpm (`pnpm -v`), and commit SHA.
      placeholder: |
        OS: macOS 15.0
        Node: v22.x
        pnpm: 10.x
        Commit: abc1234
    validations:
      required: true
