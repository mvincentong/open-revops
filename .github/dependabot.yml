version: 2
updates:
  # JavaScript/TypeScript dependencies across the pnpm workspace.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels: ["dependencies"]
    commit-message:
      prefix: "chore(deps)"
    groups:
      # Batch low-risk updates to cut PR noise.
      minor-and-patch:
        update-types: ["minor", "patch"]

  # GitHub Actions used by the workflows above.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    labels: ["dependencies", "ci"]
    commit-message:
      prefix: "chore(ci)"
