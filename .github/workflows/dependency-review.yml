name: Dependency Review

# Flags vulnerable or incompatibly-licensed dependencies introduced by a PR before merge.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  dependency-review:
    name: Review dependency changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Dependency review
        uses: actions/dependency-review-action@v5
        with:
          # Fail the PR on known-vulnerable dependencies.
          fail-on-severity: high
          # Keep the project Apache-2.0-compatible: deny copyleft / unclear licenses.
          deny-licenses: GPL-2.0, GPL-3.0, AGPL-3.0, LGPL-3.0, SSPL-1.0
          comment-summary-in-pr: on-failure
